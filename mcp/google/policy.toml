# google policy, TASK-040 MCP-07 (spec Appendix A). Anything not listed is blocked (fail closed).
# tool_sha256 = "" means PENDING: it never matches a live tool, so every tool stays blocked
# until the owner/tester fills it from `python -m core.mcp dump google` (needs the pinned server installed).
# Conventions used by this file (MCP-02 loader must accept them):
#   scope.kind: github_repo | clickup_space | google_calendar | google_drive | hostinger_vm; no `scope` = Praw only.
#   force values starting "$access:" / "$env:" are resolved from mcp/access.toml / the bot env at call time.
#   ids = {dot path = kind} (G040-01); an absent key is skipped. Rule paths may use [*]; strings compare strip().casefold().
#   Base class of a dispatch tool is the lowest class among its dispatch values.
# Calendar/Drive/Docs/Sheets only, no Gmail (owner answer). Arg names (folder_id, document_id, action enums ...) are best
# guesses and MUST be checked against `dump`; a mismatch fails closed (scope_unverified / blocked).

service = "google"
server_version = "2.6.0"

[tools.list_calendars]
class = "read"
tool_sha256 = ""  # PENDING: fill from `python -m core.mcp dump google`
strip = ["user_google_email", "file_path", "file_url", "fileUrl"]
force = { user_google_email = "$env:MCP_GOOGLE_USER_EMAIL" }
ids = { file_id = "google_file_id", folder_id = "google_file_id", parent_folder_id = "google_file_id", document_id = "google_file_id", spreadsheet_id = "google_file_id", calendar_id = "google_calendar_id", destination_calendar_id = "google_calendar_id" }
allow_args = []
[[tools.list_calendars.rules]]
when = { arg = "file_path", present = true }
class = "blocked"
[[tools.list_calendars.rules]]
when = { arg = "file_url", present = true }
class = "blocked"
[[tools.list_calendars.rules]]
when = { arg = "fileUrl", present = true }
class = "blocked"

