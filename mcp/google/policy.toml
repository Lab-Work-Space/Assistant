[tools.manage_event]
class = "write"
tool_sha256 = ""  # PENDING: fill from `python -m core.mcp dump google`
scope = { kind = "google_calendar", arg = ["calendar_id", "destination_calendar_id"] }
attribution = [{ field = "description", style = "bold_prefix", set_if_absent = true }]
strip = ["user_google_email", "file_path", "file_url", "fileUrl", "guests_can_modify", "guests_can_invite_others", "guests_can_see_other_guests"]
force = { user_google_email = "$env:MCP_GOOGLE_USER_EMAIL" }
ids = { file_id = "google_file_id", folder_id = "google_file_id", parent_folder_id = "google_file_id", document_id = "google_file_id", spreadsheet_id = "google_file_id", calendar_id = "google_calendar_id", destination_calendar_id = "google_calendar_id" }
allow_args = []
[[tools.manage_event.rules]]
when = { arg = "guests_can_modify", present = true }
class = "settings"
[[tools.manage_event.rules]]
when = { arg = "guests_can_invite_others", present = true }
class = "settings"
[[tools.manage_event.rules]]
when = { arg = "guests_can_see_other_guests", present = true }
class = "settings"
[[tools.manage_event.rules]]
when = { arg = "visibility", equals = "public" }
class = "settings"
[[tools.manage_event.rules]]
when = { arg = "file_path", present = true }
class = "blocked"
[[tools.manage_event.rules]]
when = { arg = "file_url", present = true }
class = "blocked"
[[tools.manage_event.rules]]
when = { arg = "fileUrl", present = true }
class = "blocked"
[tools.manage_event.dispatch]
arg = "action"
map = { create = "write", update = "write", move = "write", rsvp = "write", delete = "delete_recoverable" }

