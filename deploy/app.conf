# lw-git config for apps/assistant (Discord AI Company Core). Installed to /etc/labworkspace/git-apps.d/apps-assistant.conf.
# Read-only deploy key; lw-git only fetches. Outbound-only service: nothing else calls it, so no bridge.
REPO=git@github.com:Lab-Work-Space/Assistant.git
BRANCH=main
KEY=/etc/labworkspace/git-keys/Assistant
BUILD_MEM=1536m
BRIDGE=0
# Build recipe: this repo's deploy/Dockerfile (.dockerignore excludes .env*).
DOCKERFILE=deploy/Dockerfile
