# Document renderer (owner's Mac only). Start: npm run local:render   Stop: npm run local:render:down
# Gate 1 RF15 (RFMD P3): business documents (money, tax, HR) are rendered in a Chrome that has NO route anywhere and is NOT the web-browsing Chrome.
#
#   host (app, native) --127.0.0.1:9224--> [renderfwd] --internal net (no gateway)--> [renderer]
#
# renderer: its only network is `internal` (internal: true, no gateway), no proxy container, nothing published, no env, no mounts (a tmpfs only), nobody,
# read-only rootfs, no capabilities, the same seccomp profile and image pin as docker-compose.chrome.yml. The proxy flags point at a dead loopback port, so
# even a request that found a route would fail.
# renderfwd: runs no proxy. It forwards the host's DevTools connection to the renderer only after the per-boot bearer token (RENDER_ACCESS_TOKEN,
# minted by scripts/dev.sh render up, never written to a file) and refuses callers from the renderer's own network. It needs a second, dedicated bridge
# (`hostside`) only because Docker cannot publish a port from an internal network; the renderer is not on it.
# This file is not given the env file on purpose: nothing from ~/.config/assistant reaches either container.
name: assistant-render
services:
  renderer:
    # chromedp/headless-shell, multi-arch index digest (Chromium 157 at pin time). Bump with every Chrome security release, together with docker-compose.chrome.yml.
    image: chromedp/headless-shell@sha256:7bee201478b2f6266aae01243740ee85c16281e32f42d3aed9fdf04f4eace7a1
    init: true
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chrome/seccomp.json
    pids_limit: 256
    mem_limit: 768m
    cpus: 1
    shm_size: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      HOME: /tmp/home
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        mkdir -p /tmp/home /tmp/profile;
        socat TCP4-LISTEN:9222,fork,reuseaddr TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell
        --remote-debugging-port=9223
        --user-data-dir=/tmp/profile
        --proxy-server=http://127.0.0.1:1
        '--proxy-bypass-list=<-loopback>'
        --disable-quic
        --webrtc-ip-handling-policy=disable_non_proxied_udp
        --force-webrtc-ip-handling-policy=disable_non_proxied_udp
        --dns-prefetch-disable
        --disable-background-networking
        --disable-component-update
        --disable-sync
        --disable-default-apps
        --disable-extensions
        --no-first-run
        --no-pings
        --disable-crash-reporter
        --disable-breakpad
        --use-mock-keychain
        --password-store=basic
        --disable-gpu
        --use-gl=angle --use-angle=swiftshader
        --js-flags=--max-old-space-size=128
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9223 && printf 'GET /json/version HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 head -n1 <&3 | grep -q 200"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      internal:
        ipv4_address: 10.88.78.3
    restart: unless-stopped

  renderfwd:
    build:
      context: .
      dockerfile: docker/render/forwarder.Dockerfile
    image: assistant-render-forwarder:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    environment:
      # generated by scripts/dev.sh render up for this boot only (never written to a file); dev.sh reads it back from the container for the app
      ACCESS_TOKEN: ${RENDER_ACCESS_TOKEN:?start with npm run local:render}
      INTERNAL_CIDR: 10.88.78.0/24
      FWD_TARGET: 10.88.78.3:9222
      FWD_PORT: "9224"
    ports:
      - "127.0.0.1:9224:9224"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(9224, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      internal:
        ipv4_address: 10.88.78.2
      hostside: {}
    depends_on:
      renderer:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.88.78.0/24
  # only for publishing the forwarder's port on 127.0.0.1; the renderer is never attached to it
  hostside: {}
