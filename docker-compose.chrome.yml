# Chrome for the web tools (owner's Mac only). Start: npm run local:chrome   Stop: npm run local:chrome:down
# Gate 1 Part C (C24, C25, C28, N3, N4); design: docs/superpowers/specs/2026-11-01-praw-admin-console-design.md, section C.
#
#   host (app, native) --127.0.0.1:9222--> [guardproxy] --internal net--> [chrome]
#   host (app, native) --127.0.0.1:9223--> [guardproxy] control API (mint/read/end a per-call proxy credential)
#   [chrome] --proxy 10.88.77.2:3128--> [guardproxy] --egress net--> the internet (only checked public addresses)
#
# chrome has NO route except the proxy: its only network is `internal` (no gateway, nothing published). guardproxy is the only
# container on `egress`. chrome gets no env, no mounts (a tmpfs only), runs as nobody on a read-only rootfs with no capabilities,
# and Chrome's sandbox stays ON (seccomp profile = Docker default + clone/clone3/unshare/setns/chroot, see docker/chrome/README.md).
# This file is not given the env file on purpose: nothing from ~/.config/assistant reaches either container.
name: assistant-chrome
services:
  chrome:
    # chromedp/headless-shell, multi-arch index digest (Chromium 157 at pin time). Bump with every Chrome security release.
    image: chromedp/headless-shell@sha256:7bee201478b2f6266aae01243740ee85c16281e32f42d3aed9fdf04f4eace7a1
    init: true
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chrome/seccomp.json
    pids_limit: 512
    mem_limit: 1g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    environment:
      HOME: /tmp/home
    entrypoint: ["/bin/bash", "-c"]
    # socat only republishes Chrome's loopback DevTools port on the container address (the proxy container is the one that forwards it to the host).
    command:
      - >-
        mkdir -p /tmp/home /tmp/profile;
        socat TCP4-LISTEN:9222,fork,reuseaddr TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell
        --remote-debugging-port=9223
        --user-data-dir=/tmp/profile
        --proxy-server=http://10.88.77.2:3128
        '--proxy-bypass-list=<-loopback>'
        --disable-quic
        --webrtc-ip-handling-policy=disable_non_proxied_udp
        --force-webrtc-ip-handling-policy=disable_non_proxied_udp
        --dns-prefetch-disable
        --disable-background-networking
        --disable-component-update
        --disable-sync
        --disable-default-apps
        --disable-extensions
        --no-first-run
        --no-pings
        --disable-crash-reporter
        --disable-breakpad
        --use-mock-keychain
        --password-store=basic
        --disable-gpu
        --use-gl=angle --use-angle=swiftshader
        --js-flags=--max-old-space-size=256
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9223 && printf 'GET /json/version HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 head -n1 <&3 | grep -q 200"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      internal:
        ipv4_address: 10.88.77.3
    restart: unless-stopped

  guardproxy:
    build:
      context: .
      dockerfile: docker/chrome/proxy.Dockerfile
    image: assistant-chrome-guardproxy:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      # generated by scripts/dev.sh chrome up for this boot only (never written to a file); dev.sh reads it back from the container for the app
      ACCESS_TOKEN: ${CHROME_ACCESS_TOKEN:?start with npm run local:chrome}
      INTERNAL_CIDR: 10.88.77.0/24
      CDP_TARGET: 10.88.77.3:9222
      CAP_BYTES: "8388608"
      CAP_REQUESTS: "200"
    ports:
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:9223:9223"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9223/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      internal:
        ipv4_address: 10.88.77.2
      egress: {}
    depends_on:
      chrome:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.88.77.0/24
  egress: {}
